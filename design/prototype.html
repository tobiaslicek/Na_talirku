<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="tc-light" content="#F1F3F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" id="tc-dark" content="#0B1130" media="(prefers-color-scheme: dark)">
<script>try{document.documentElement.dataset.style=localStorage.getItem("talirek-style-2")||"mix"}catch(e){document.documentElement.dataset.style="mix"}</script>
<title>Na talířku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1&family=Instrument+Sans:wght@400..700&family=Alegreya:ital,wght@0,400..900;1,400..900&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F3F8;--surface:#FFFFFF;--tint:#E3E9F5;--paper:#FBFBF8;
  --ink:#15204B;--ink-2:#4B5785;--ink-3:#8790B3;
  --accent:#23398E;--on-accent:#FFFFFF;--accent-text:#23398E;
  --poppy:#C42E2A;--stitch-blue:#23398E;
  --line:rgba(35,57,142,.12);--line-strong:rgba(35,57,142,.24);
  --plate-shadow:0 1px 1px rgba(21,32,75,.05),0 12px 26px -14px rgba(21,32,75,.34),0 3px 7px -3px rgba(21,32,75,.14);
  --plate-shadow-sm:0 6px 14px -8px rgba(21,32,75,.38),0 1px 3px rgba(21,32,75,.1);
  --plate-shadow-lg:0 34px 60px -30px rgba(21,32,75,.5),0 10px 22px -10px rgba(21,32,75,.2);
  --scrim:rgba(11,17,48,.38);
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);
  --serif:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1130;--surface:#131B41;--tint:#1E2959;--paper:#18214B;
    --ink:#E9EDF8;--ink-2:#A6B0D6;--ink-3:#6E79A6;
    --accent:#C9D5FA;--on-accent:#0B1130;--accent-text:#B9C8F7;
    --poppy:#F07065;--stitch-blue:#8EA2E0;
    --line:rgba(185,200,247,.13);--line-strong:rgba(185,200,247,.26);
    --plate-shadow:0 14px 30px -14px rgba(0,0,0,.75),0 3px 8px -3px rgba(0,0,0,.5);
    --plate-shadow-sm:0 8px 16px -8px rgba(0,0,0,.7);
    --plate-shadow-lg:0 40px 70px -30px rgba(0,0,0,.85),0 10px 24px -10px rgba(0,0,0,.5);
    --scrim:rgba(3,6,20,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1130;--surface:#131B41;--tint:#1E2959;--paper:#18214B;
  --ink:#E9EDF8;--ink-2:#A6B0D6;--ink-3:#6E79A6;
  --accent:#C9D5FA;--on-accent:#0B1130;--accent-text:#B9C8F7;
  --poppy:#F07065;--stitch-blue:#8EA2E0;
  --line:rgba(185,200,247,.13);--line-strong:rgba(185,200,247,.26);
  --plate-shadow:0 14px 30px -14px rgba(0,0,0,.75),0 3px 8px -3px rgba(0,0,0,.5);
  --plate-shadow-sm:0 8px 16px -8px rgba(0,0,0,.7);
  --plate-shadow-lg:0 40px 70px -30px rgba(0,0,0,.85),0 10px 24px -10px rgba(0,0,0,.5);
  --scrim:rgba(3,6,20,.6);
  color-scheme:dark;
}
:root[data-style="kroj"]{
  --bg:#FFFEFC;--surface:#FFFFFF;--tint:#F4EEE3;--paper:#FBF9F4;
  --ink:#17141C;--ink-2:#5D5561;--ink-3:#968D98;
  --accent:#17141C;--on-accent:#FBF7EF;--accent-text:#9E1E27;
  --ok:#3E6A34;--dot-ok:#17141C;--gold:#C9A040;--velvet:#16131B;
  --poppy:#C0262D;
  --line:rgba(23,20,28,.12);--line-strong:rgba(23,20,28,.24);
  --plate-shadow:0 1px 1px rgba(30,20,20,.05),0 12px 26px -14px rgba(30,20,20,.36),0 3px 7px -3px rgba(30,20,20,.14);
  --plate-shadow-sm:0 6px 14px -8px rgba(30,20,20,.4),0 1px 3px rgba(30,20,20,.1);
  --plate-shadow-lg:0 30px 50px -28px rgba(60,30,20,.4),0 8px 18px -8px rgba(60,30,20,.16);
  --baby:#E2AEBA;
  --scrim:rgba(16,12,18,.45);
  --serif:"Alegreya","Iowan Old Style",Georgia,serif;
  --sans:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root[data-style="kroj"]:not([data-theme="light"]){
    --bg:#110F15;--surface:#1B1820;--tint:#2B2531;--paper:#1F1B25;
    --ink:#F3EEE5;--ink-2:#BCB2B8;--ink-3:#80767F;
    --accent:#D8B24E;--on-accent:#16131B;--accent-text:#E6BF5C;
    --ok:#9CC27F;--dot-ok:#E6BF5C;--velvet:#0A090D;--baby:#FBF6EC;
    --plate-shadow-lg:0 34px 54px -26px rgba(0,0,0,.85),0 10px 22px -10px rgba(0,0,0,.5);
    --poppy:#EE6B6F;
    --line:rgba(243,238,229,.12);--line-strong:rgba(243,238,229,.24);
    --plate-shadow:0 14px 30px -14px rgba(0,0,0,.8),0 3px 8px -3px rgba(0,0,0,.55);
    --plate-shadow-sm:0 8px 16px -8px rgba(0,0,0,.75);
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-style="kroj"][data-theme="dark"]{
  --bg:#110F15;--surface:#1B1820;--tint:#2B2531;--paper:#1F1B25;
  --ink:#F3EEE5;--ink-2:#BCB2B8;--ink-3:#80767F;
  --accent:#D8B24E;--on-accent:#16131B;--accent-text:#E6BF5C;
  --ok:#9CC27F;--dot-ok:#E6BF5C;--velvet:#0A090D;--baby:#FBF6EC;
  --plate-shadow-lg:0 34px 54px -26px rgba(0,0,0,.85),0 10px 22px -10px rgba(0,0,0,.5);
  --poppy:#EE6B6F;
  --line:rgba(243,238,229,.12);--line-strong:rgba(243,238,229,.24);
  --plate-shadow:0 14px 30px -14px rgba(0,0,0,.8),0 3px 8px -3px rgba(0,0,0,.55);
  --plate-shadow-sm:0 8px 16px -8px rgba(0,0,0,.75);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html.lock{overflow:hidden}
body{margin:0;overflow-x:clip;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:3px;border-radius:10px}

.app{max-width:1120px;margin:0 auto;padding:0 20px calc(124px + env(safe-area-inset-bottom,0px))}

.hero{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"copy" "stage" "prefs";padding-top:clamp(64px,7vw,80px)}
.hero-copy{grid-area:copy;min-width:0}
.date{margin:0;color:var(--ink-2);font-size:15px}
.display{font-family:var(--serif);font-optical-sizing:auto;font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:540;font-size:clamp(46px,13vw,92px);line-height:.95;letter-spacing:-.025em;margin:6px 0 0;text-wrap:balance}
.stage{grid-area:stage;position:relative;width:min(100%,420px);aspect-ratio:1;justify-self:center;margin:28px 0 6px}
.hero-scroll,.hero-turn{position:absolute;inset:0}
.plate-shadow{position:absolute;inset:0;border-radius:50%;box-shadow:var(--plate-shadow-lg)}
.wreath{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none;overflow:visible}
.plate{display:block;width:100%;height:100%;transform-origin:50% 50%}
.advise-wrap{position:absolute;inset:0;margin:auto;width:41%;height:41%}
.advise{position:relative;width:100%;height:100%;border:0;border-radius:50%;background:#23398E;color:#FDFEFF;font-family:var(--serif);font-variation-settings:"SOFT" 100,"WONK" 0;font-weight:560;font-size:clamp(19px,5.2vw,26px);line-height:1.05;letter-spacing:-.01em;box-shadow:inset 0 0 0 5px #23398E,inset 0 0 0 6.2px rgba(253,254,255,.55),0 6px 16px -6px rgba(21,32,75,.5);transition:transform 160ms var(--ease-out)}
.advise:active{transform:scale(.95)}
.advise:focus-visible{outline-offset:6px;border-radius:50%}

.prefs{grid-area:prefs;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:22px;min-width:0}
.pref-label{display:block;font-size:13.5px;color:var(--ink-2);margin-bottom:8px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:8px 15px;font-size:14.5px;font-weight:500;color:var(--ink);transition:background-color 160ms ease,color 160ms ease,border-color 160ms ease,transform 160ms var(--ease-out)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
@media (min-width:900px){
  .hero{grid-template-columns:minmax(0,1fr) minmax(0,440px);grid-template-areas:"copy stage" "prefs stage";column-gap:64px;align-items:end}
  .prefs{align-self:start;margin-top:30px}
  .stage{margin:0}
  .hero .chips{margin:0;padding:2px 0;flex-wrap:wrap}
}

.stitch{display:block;width:100%;height:22px;margin:36px 0 6px}
.st-r{fill:var(--poppy)}
.st-b{fill:var(--stitch-blue)}
.st-l{stroke:var(--stitch-blue)}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:40px 0 18px}
.sec-head h2,.zone-head h2{font-family:var(--serif);font-variation-settings:"SOFT" 100,"WONK" 0;font-weight:520;font-size:clamp(26px,6.6vw,34px);line-height:1.05;letter-spacing:-.015em;margin:0}
.link{background:none;border:0;padding:6px 2px;color:var(--accent-text);font-weight:600;font-size:15px;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.quiet{color:var(--ink-2);margin:0}

.dish{display:block;position:relative;border-radius:50%;box-shadow:var(--plate-shadow);aspect-ratio:1}
.dish.sm{width:64px;box-shadow:var(--plate-shadow-sm)}

.suggest-track{display:grid;grid-auto-flow:column;grid-auto-columns:min(80%,310px);gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -20px;padding:8px 20px 22px}
.suggest-track::-webkit-scrollbar{display:none}
.s-card{display:flex;flex-direction:column;scroll-snap-align:center}
.dish-btn{display:block;width:100%;padding:0;border:0;background:none;border-radius:50%}
.s-body{display:flex;flex-direction:column;flex:1}
.s-name{font-family:var(--serif);font-variation-settings:"SOFT" 100,"WONK" 0;font-weight:540;font-size:25px;line-height:1.08;letter-spacing:-.01em;margin:22px 0 6px}
.s-meta{margin:0;color:var(--ink-2);font-size:14.5px}
.need{margin:12px 0 18px;font-size:15px;line-height:1.45}
.need-label{color:var(--ink-2)}
.need .ok{color:var(--ok,var(--accent-text));font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:15.5px;transition:transform 160ms var(--ease-out),background-color 160ms ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{border-color:var(--line-strong);background:transparent;color:var(--ink)}
.s-body .btn{margin-top:auto;align-self:flex-start}
@media (min-width:900px){
  .suggest-track{grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible;margin:0;padding:8px 0 22px;gap:40px}
}

.f-row{display:grid;grid-template-columns:64px 1fr;gap:18px;align-items:center;width:100%;padding:12px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:inherit}
.f-text{display:block}
.f-name{display:block;font-family:var(--serif);font-variation-settings:"SOFT" 100,"WONK" 0;font-size:19px;font-weight:520;line-height:1.15}
.f-when{display:block;font-size:14px;color:var(--ink-2);margin-top:2px}
@media (min-width:900px){#forgotten{display:grid;grid-template-columns:1fr 1fr;column-gap:48px}}

.low-box{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}

.page-head{padding-top:clamp(64px,7vw,80px)}
.title{font-family:var(--serif);font-optical-sizing:auto;font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:540;font-size:clamp(42px,11.5vw,76px);line-height:.98;letter-spacing:-.022em;margin:0}
.sub{margin:10px 0 0;color:var(--ink-2);font-size:15.5px;max-width:52ch}
.page-head + .stitch{margin:26px 0 22px}

.filter{margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 18px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 28px}}
@media (min-width:960px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.m-card{display:block;padding:0;border:0;background:none;color:inherit;text-align:center}
.m-text{display:block}
.m-name{display:block;font-family:var(--serif);font-variation-settings:"SOFT" 100,"WONK" 0;font-size:17.5px;font-weight:520;line-height:1.15;margin-top:14px;text-wrap:balance}
.m-sub{display:block;font-size:13px;line-height:1.35;color:var(--ink-2)}
.m-name + .m-sub{margin-top:4px}

.receipt{display:flex;align-items:center;gap:16px;width:100%;padding:16px 18px;border-radius:22px;border:1.5px dashed var(--line-strong);background:var(--surface);text-align:left;color:inherit;transition:transform 160ms var(--ease-out)}
.receipt:active{transform:scale(.985)}
.ico-lg{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);flex:none}
.receipt-t{display:block;font-family:var(--serif);font-variation-settings:"SOFT" 100,"WONK" 0;font-weight:560;font-size:19px;line-height:1.2}
.receipt-s{display:block;color:var(--ink-2);font-size:14px;margin-top:2px}
.zone{margin-top:36px}
.zone-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.zone-head h2{font-size:clamp(24px,6vw,30px)}
.zone-count{font-size:14px;color:var(--ink-2)}
.items{display:flex;flex-wrap:wrap;gap:8px}
.item{display:inline-flex;align-items:center;gap:9px;min-height:40px;padding:0 15px 0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:15px;color:var(--ink);transition:transform 160ms var(--ease-out),background-color 160ms ease,color 160ms ease}
.item:active{transform:scale(.96)}
.item.static{cursor:default}
.item.static:active{transform:none}
.dot{width:10px;height:10px;border-radius:50%;background:var(--dot-ok,var(--accent-text));flex:none}
[data-s="dochazi"] > .dot{background:transparent;box-shadow:inset 0 0 0 2.2px var(--poppy)}
[data-s="doslo"] > .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.item .tag{color:var(--poppy);font-size:12.5px;font-weight:600}
.item[data-s="doslo"]{background:transparent;border-style:dashed;color:var(--ink-3)}
.item[data-s="doslo"] .label{text-decoration:line-through;text-decoration-thickness:1px}

.shop-add{display:flex;gap:10px}
.shop-add input{flex:1;min-width:0;min-height:48px;padding:0 18px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:16px}
.shop-add input::placeholder{color:var(--ink-3)}
.shop-list{list-style:none;margin:20px 0 0;padding:0}
.shop-item{border-bottom:1px solid var(--line)}
.shop-item label{display:flex;align-items:center;gap:14px;padding:15px 2px;cursor:pointer;font-size:17px}
.shop-for{margin-left:auto;font-size:13px;color:var(--ink-3);text-align:right}
.shop-empty{padding:18px 0;color:var(--ink-2)}
.check{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:0;border-radius:50%;border:1.5px solid var(--accent-text);display:grid;place-items:center;flex:none;cursor:pointer;transition:background-color 160ms ease}
.check::after{content:"";width:11px;height:6px;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:translateY(-1px) rotate(-45deg) scale(.6);opacity:0;transition:transform 200ms var(--ease-out),opacity 120ms ease}
.check:checked{background:var(--accent)}
.check:checked::after{opacity:1;transform:translateY(-1px) rotate(-45deg) scale(1)}
.check:disabled{opacity:.35;cursor:default}
.check:checked + .shop-name{color:var(--ink-3);text-decoration:line-through}
#clear-done{margin-top:14px}

.tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line);z-index:20}
@media (min-width:560px){.tabbar{bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-bottom:8px;border:1px solid var(--line);border-radius:26px;box-shadow:0 18px 40px -20px rgba(21,32,75,.35)}}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--ink-3);font:600 12px/1.2 var(--sans);text-decoration:none;border-radius:16px}
.ico{position:relative;display:grid;place-items:center;width:52px;height:30px;border-radius:15px;transition:background-color 200ms ease}
.tab[aria-current="page"]{color:var(--accent-text)}
.tab[aria-current="page"] .ico{background:var(--tint)}
.badge{position:absolute;top:-3px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--poppy);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}

.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity 300ms ease;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(100%,560px);max-height:90dvh;transform:translate(-50%,104%);transition:transform 460ms var(--ease-drawer);background:var(--surface);border-radius:28px 28px 0 0;z-index:41;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px -20px rgba(11,17,48,.4)}
.sheet.open{transform:translate(-50%,0)}
.sheet-grab{display:grid;place-items:center;padding:12px 0 8px;touch-action:none;cursor:grab}
.sheet-grab span{width:40px;height:5px;border-radius:3px;background:var(--line-strong)}
.sheet-close{position:absolute;top:12px;right:14px;width:38px;height:38px;border-radius:50%;border:0;background:var(--tint);color:var(--ink);display:grid;place-items:center}
.sheet-body{overflow:auto;padding:4px 22px 26px;overscroll-behavior:contain}
.dish.big{width:min(56%,240px);margin:10px auto 0}
.sheet-title{font-family:var(--serif);font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:540;font-size:clamp(28px,7.6vw,36px);line-height:1.04;letter-spacing:-.015em;text-align:center;margin:24px 0 8px;text-wrap:balance}
.meta{text-align:center;color:var(--ink-2);font-size:15px;margin:0;text-wrap:balance}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:14px 0 0}
.tag-pill{font-size:13px;padding:4px 11px;border-radius:999px;background:var(--tint);color:var(--accent-text);font-weight:500}
.ing{list-style:none;padding:0;margin:26px 0 0;border-top:1px solid var(--line)}
.ing li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
.ing .st{margin-left:auto;font-size:13.5px;color:var(--ink-2)}
.ing li[data-s="doslo"] .st{color:var(--poppy);font-weight:600}
.sheet-actions{display:grid;gap:10px;margin-top:24px}
.paper{margin:22px 0 0;padding:6px 16px;background:var(--paper);border-radius:8px;border:1px solid var(--line)}
.r-row{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px dashed var(--line-strong);cursor:pointer}
.r-row:last-child{border-bottom:0}
.r-row.off{cursor:default}
.r-txt{display:block;flex:1;min-width:0}
.r-raw{display:block;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px;color:var(--ink-3);letter-spacing:.02em}
.r-map{display:block;font-size:16px}
.r-row.off .r-map{color:var(--ink-3)}
.r-zone{font-size:13px;color:var(--ink-2)}

.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translate(-50%,14px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:16px;font-size:14.5px;line-height:1.4;width:max-content;max-width:min(92vw,440px);transition:opacity 200ms ease,transform 320ms var(--ease-out);z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:560px){.toast{bottom:calc(112px + env(safe-area-inset-bottom,0px))}}

.style-switch{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:30;display:flex;gap:2px;padding:3px;border-radius:999px;background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 8px 20px -12px rgba(0,0,0,.4)}
.style-switch button{border:0;background:transparent;border-radius:999px;padding:6px 13px;font:600 13px/1.2 var(--sans);color:var(--ink-2);transition:background-color 160ms ease,color 160ms ease}
.style-switch button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

@media (prefers-color-scheme:dark){
  :root[data-style="kroj"]:not([data-theme="light"]) :is(.hero,.page-head){background:var(--velvet);box-shadow:0 0 0 100vmax var(--velvet);clip-path:inset(0 -100vmax)}
}
:root[data-style="kroj"][data-theme="dark"] :is(.hero,.page-head){background:var(--velvet);box-shadow:0 0 0 100vmax var(--velvet);clip-path:inset(0 -100vmax)}
:root[data-style="kroj"] .hero{padding-bottom:30px}
:root[data-style="kroj"] .page-head{padding-bottom:30px}
:root[data-style="kroj"] .stitch{height:26px;width:100vw;margin:0 0 8px calc(50% - 50vw)}
:root[data-style="kroj"] .page-head + .stitch{margin:0 0 28px calc(50% - 50vw)}
:root[data-style="kroj"] .stitch rect{fill:url(#pRibbon)}
:root[data-style="kroj"] .wreath{display:block}
.wreath .bb{fill:var(--baby,#FBF6EC)}
.rb{fill:var(--ribbon,#16131B)}
:root[data-style="mix"]{--ribbon:#141C40;--baby:#E2AEBA}
@media (prefers-color-scheme:dark){:root[data-style="mix"]:not([data-theme="light"]){--baby:#FBF6EC}}
:root[data-style="mix"][data-theme="dark"]{--baby:#FBF6EC}
:root[data-style="mix"] .stitch{height:26px;width:100vw;margin:36px 0 8px calc(50% - 50vw)}
:root[data-style="mix"] .page-head + .stitch{margin:26px 0 26px calc(50% - 50vw)}
:root[data-style="mix"] .stitch rect{fill:url(#pRibbon)}
:root[data-style="mix"] .wreath{display:block}
:root[data-style="mix"] :is(.plate-shadow,.hero-turn){inset:11%}
:root[data-style="mix"] .advise-wrap{width:34%;height:34%}
:root[data-style="mix"] .advise{box-shadow:0 8px 18px -8px rgba(21,32,75,.55)}
:root[data-style="mix"] .advise::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px dashed rgba(253,254,255,.7);pointer-events:none}
:root[data-style="kroj"] :is(.plate-shadow,.hero-turn){inset:11%}

:root[data-style="kroj"] .advise::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px dashed rgba(255,246,236,.72);pointer-events:none}
:root[data-style="kroj"] :is(.display,.title,.sec-head h2,.zone-head h2,.s-name,.m-name,.f-name,.sheet-title,.receipt-t){font-weight:700;letter-spacing:-.008em}
:root[data-style="kroj"] .display{line-height:.98}
:root[data-style="kroj"] .btn.primary{box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 0 3px var(--gold)}
:root[data-style="kroj"] .chips .chip{font-size:15px}

@media (prefers-reduced-motion:reduce){
  .sheet,.scrim,.toast{transition-duration:1ms}
}

  <section class="view" id="v-doma" hidden>

</main>

const PB = "#23398E", PG = "#8197D3", NB = "\u00A0";
const KR = "#B8232B", KG = "#C9A040", KL = "#4F7A3A", KP = "#E07A8E";
let STYLE = ["cibulak", "mix", "kroj"].includes(document.documentElement.dataset.style) ? document.documentElement.dataset.style : "mix";
const suf = () => STYLE === "kroj" ? "-k" : "";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const n1 = v => v.toFixed(1);
const rad = d => d * Math.PI / 180;
const pol = (a, r, cx = 100, cy = 100) => [cx + r * Math.cos(rad(a)), cy + r * Math.sin(rad(a))];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function rng(seed) {
  let h = 1779033703 ^ seed.length;
  for (let i = 0; i < seed.length; i++) { h = Math.imul(h ^ seed.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  let a = h >>> 0;
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function smooth(pts) {
  const m = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  const s = m(pts[pts.length - 1], pts[0]);
  let d = `M${n1(s[0])} ${n1(s[1])}`;
  for (let i = 0; i < pts.length; i++) {

}
function blob(cx, cy, R, r, amp = .08, n = 18) {

  for (let i = 0; i < n; i++) {

}
function inDisc(r, cx, cy, R) { const a = r() * Math.PI * 2, k = Math.sqrt(r()) * R; return [cx + k * Math.cos(a), cy + k * Math.sin(a)]; }
function dots(r, n, cx, cy, R, colors, rmin, rmax, op = 1) {

}
function strokes(r, n, cx, cy, R, len, colors, w) {

}

  const pome = `<path d="M-6.6 .8C-6.6-4-3.6-6.6 0-6.6S6.6-4 6.6 .8 3.6 7 0 7-6.6 5.6-6.6 .8Z" fill="${PG}" fill-opacity=".5" stroke="${PB}" stroke-width=".8"/><path d="M-3-5.6C-4.7-1.2-4.6 3-2.4 6.6M3-5.6C4.7-1.2 4.6 3 2.4 6.6M0-6.6V7" fill="none" stroke="${PB}" stroke-width=".5"/><path d="M-2.8-6.1-1.7-9.2 0-7.1 1.7-9.2 2.8-6.1Z" fill="${PB}"/><path d="M-7 3.2C-9.6 1.6-11.8-.6-13.6-3.6-10.4-3.2-8.2-1.2-7 3.2Z" fill="${PB}"/><path d="M7 3.2C9.6 1.6 11.8-.6 13.6-3.6 10.4-3.2 8.2-1.2 7 3.2Z" fill="${PB}"/>`;

  }

}

function dish(m) {
  const D = m.dish; D.id = m.id;
  const r = rng(m.id);
  let s = "";
  if (D.soup) s += `<circle cx="100" cy="100" r="58" fill="url(#s-${m.id})"/><circle cx="100" cy="100" r="53" fill="none" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="1.2"/>`;
  else if (D.sauce) s += `<path d="${blob(100, 100, D.sauceR || 41, r, .1, 20)}" fill="url(#s-${m.id})"/>`;
  if (D.lentils) s += dots(r, 110, 100, 100, 40, ["#6A4C2A", "#A08259", "#836338"], .6, 1.1, .9);
  if (D.side) s += SIDE[D.side](r, D);
  if (D.top) s += `<path d="${blob(100, 98, 17, r, .18, 16)}" fill="url(#s-${m.id})"/>` + dots(r, 14, 100, 98, 13, ["#7A2614", "#8F3A22"], .6, 1.2);
  if (D.protein) s += PROT[D.protein](r, D);
  (D.garnish || []).forEach(([g, x, y]) => s += GAR[g](r, x, y));
  return s;
}

function rimKroj() {

  s += `<path class="vine" d="${smooth(vine)}" fill="none" stroke="${KL}" stroke-width=".65"/>`;
  let ros = "";
  for (let i = 0; i < 6; i++) ros += `<ellipse cx="0" cy="-3.7" rx="1.9" ry="3.2" fill="${KR}" transform="rotate(${i * 60})"/>`;
  for (let i = 0; i < 6; i++) { const [x, y] = pol(i * 60 - 60, 6, 0, 0); ros += `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r=".85" fill="${KP}"/>`; }
  ros += `<circle r="1.7" fill="${KG}"/>`;
  const sprig = `<path d="M-7 .6C-3.5-1.4 2.5 1.6 7-.4" fill="none" stroke="${KL}" stroke-width=".6"/><path d="M-3.6-.3C-3-2.6-1.2-3.4.2-3.2-.6-1.6-1.8-.6-3.6-.3Z" fill="${KL}"/><path d="M2.4.5C2.8 2.8 4.6 3.6 6 3.3 5.2 1.8 4 .9 2.4.5Z" fill="${KL}"/><path d="M-.6.2C-.2 2.2 1.2 3.2 2.4 3.1 1.8 1.6.8.6-.6.2Z" fill="${KL}" opacity=".8"/><circle cx="-7.4" cy=".7" r="1.25" fill="${KP}"/><circle cx="7.4" cy="-.5" r="1.25" fill="${KR}"/>`;
  for (let k = 0; k < 10; k++) {
    s += `<g transform="rotate(${k * 36} 100 100)"><g class="motif"><g transform="translate(100 17)">${ros}</g></g></g>`;

}

function wreathMarkup() {
  const r = rng("venecek");
  const types = ["daisy", "red", "rose", "corn", "yellow", "rose", "red", "daisy", "rose", "corn", "red", "rose", "yellow", "red", "daisy"];
  const n = types.length, a0 = 198, a1 = 342;
  let leaves = "", baby = "", fl = "";
  for (let i = 0; i < n + 5; i++) {
    const a = a0 - 8 + (a1 - a0 + 16) * i / (n + 4), [x, y] = pol(a, 82.5 + (r() - .5) * 4);
    const rot = a + 90 + (i % 2 ? 35 : -35) + (r() - .5) * 20;
    leaves += `<g transform="translate(${n1(x)} ${n1(y)}) rotate(${rot.toFixed(0)})"><path class="lf" d="M0 0C3-3.2 9-3.4 12.5 0 9 3.4 3 3.2 0 0Z" fill="${i % 3 ? "#5E8A45" : "#44703A"}"/></g>`;
  }
  for (let i = 0; i < 20; i++) { const [x, y] = pol(a0 + r() * (a1 - a0), 86 + r() * 7); baby += `<circle cx="${n1(x)}" cy="${n1(y)}" r="${(.6 + r() * .5).toFixed(2)}" class="bb"/>`; }
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1), a = a0 + (a1 - a0) * t, [x, y] = pol(a, 82 + (i % 2 ? 3 : -2.5) + (r() - .5) * 2);
    const sc = (.82 + r() * .25) * (1 + .28 * (1 - Math.abs(t - .5) * 2));
    fl += `<g transform="translate(${n1(x)} ${n1(y)}) scale(${sc.toFixed(2)}) rotate(${(r() * 360).toFixed(0)})"><g class="fl">${FL[types[i]]}</g></g>`;
  }
  return `<g>${leaves}</g><g>${baby}</g>${fl}`;
}

Object.keys(base.pantry).forEach(n => { if (!S.pantry[n]) S.pantry[n] = base.pantry[n]; });

function ago(d) {
  if (d <= 0) return "dnes";

  if (d < 7) return `před ${d}${NB}dny`;
  if (d < 30) { const w = Math.round(d / 7); return w === 1 ? "před týdnem" : `před ${w}${NB}týdny`; }
  const mo = Math.round(d / 30);

}
const minutes = m => m.min < 60 ? `${m.min}${NB}min` : (m.min % 60 ? `${Math.floor(m.min / 60)}${NB}h ${m.min % 60}${NB}min` : `${m.min / 60}${NB}h`);

let picks = [];
function pick(exclude = []) {
  const { time, mood } = S.prefs;
  let pool = MEALS.filter(m => m.min <= time && (mood === "any" || m.tags.includes(mood)) && daysSince(S.cooked[m.id]) > 1);
  const fresh = pool.filter(m => !exclude.includes(m.id));
  if (fresh.length >= 3) pool = fresh;
  return pool.map(m => {
    const cov = (m.ing.length - missing(m).length) / m.ing.length;
    const d = Math.min(daysSince(S.cooked[m.id]), 45);
    return { m, score: cov * 55 + d * .9 + Math.random() * 22 };
  }).sort((a, b) => b.score - a.score).slice(0, 3).map(x => x.m);
}

function addShop(name, forMeal) {

      const st = { trigger: ".hero", start: "top top", end: "bottom top", scrub: .6 };
      G.to(".hero-scroll", { yPercent: -6, scale: .9, ease: "none", scrollTrigger: st });
      G.to(".hero-turn", { rotation: 80, ease: "none", scrollTrigger: { ...st } });
      $$("#v-dnes .stitch").forEach(el => STYLE === "kroj"
        ? G.fromTo(el, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 1.3, ease: "power2.inOut", delay: .5 })
        : G.fromTo(el, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", ease: "none", scrollTrigger: { trigger: el, start: "top 96%", end: "top 55%", scrub: .4 } }));
      const rows = $$("#forgotten .f-row");
      if (rows.length) revealPlates(rows, { x: -28, rot: -170, text: ".f-text" });
    } else {
      G.from(`#v-${v} .page-head > *`, { y: 22, autoAlpha: 0, duration: .75, ease: "power3.out", stagger: .07 });
      G.fromTo(`#v-${v} .stitch`, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 1.2, ease: "power2.inOut", delay: .12 });
      if (v === "jidla") revealPlates($$("#grid .m-card"), { y: 30, scale: .92, rot: -80, text: ".m-text" });
    }
  });
  requestAnimationFrame(() => ST.refresh());
}

function advise(spin) {
  picks = pick(picks.map(m => m.id));
  renderSuggest();
  const sec = $("#suggest");
  const first = sec.hidden;
  sec.hidden = false;
  if (!motion()) { sec.scrollIntoView({ block: "start" }); return; }
  if (spin) {
    G.to(".hero-spin", { rotation: "+=360", duration: 1.05, ease: "power3.inOut" });
    G.fromTo(".advise-wrap", { scale: 1 }, { scale: .9, duration: .14, yoyo: true, repeat: 1, ease: "power2.out" });
  }
  const cards = $$("#suggest .s-card"), delay = spin ? .7 : .05;
  G.from(cards.map(c => $(".dish", c)), { autoAlpha: 0, x: -50, scale: .9, duration: .9, ease: "power3.out", stagger: .12, delay });
  G.from(cards.map(c => $(".plate", c)), { rotation: -220, duration: 1.4, ease: "expo.out", stagger: .12, delay });
  G.from(cards.map(c => $(".s-body", c)), { autoAlpha: 0, y: 14, duration: .6, ease: "power3.out", stagger: .1, delay: delay + .2 });
  ST.refresh();
  if (spin || first) setTimeout(() => sec.scrollIntoView({ behavior: "smooth", block: "start" }), spin ? 600 : 0);
}

const VIEWS = ["dnes", "jidla", "doma", "nakup"];
const RENDER = { dnes: renderToday, jidla: renderCatalog, doma: renderPantry, nakup: renderShop };
function route() {
  const h = location.hash.slice(1), v = VIEWS.includes(h) ? h : "dnes";
  closeSheet();
  VIEWS.forEach(n => {
    $("#v-" + n).hidden = n !== v;
    const t = $(`.tab[data-tab="${n}"]`);
    if (n === v) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
  });
  RENDER[v]();
  window.scrollTo(0, 0);
  animateView(v);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-open],[data-cook],[data-buy],[data-pref-set],[data-filter],[data-item],[data-low],[data-r-save],[data-style-set],#advise,#reroll,#receipt,#scrim,#sheet-close,#clear-done");
  if (!t) return;
  const d = t.dataset;
  if (d.open) return openMeal(d.open);
  if (d.cook) { closeSheet(); return cook(d.cook); }
  if (d.buy) {
    const m = byId[d.buy], added = missing(m).filter(n => addShop(n, m.name));
    save(); renderShop(); closeSheet();
    return toast(added.length ? `Do nákupu přibylo: ${added.join(", ")}.` : "Všechno už v nákupu je.");
  }
  if (d.prefSet) {
    S.prefs[d.prefSet] = d.prefSet === "time" ? +d.v : d.v;
    save(); renderPrefs();
    if (!$("#suggest").hidden) advise(false);
    return;
  }
  if (d.filter) {
    filter = d.filter; renderCatalog();
    if (motion()) {
      const cards = $$("#grid .m-card");
      G.from(cards.map(c => $(".dish", c)), { autoAlpha: 0, scale: .92, duration: .5, ease: "power3.out", stagger: .04 });
      G.from(cards.map(c => $(".plate", c)), { rotation: -70, duration: .9, ease: "expo.out", stagger: .04 });
      ST.refresh();
    }
    return;
  }
  if (d.item !== undefined) {
    const n = d.item, next = { mame: "dochazi", dochazi: "doslo", doslo: "mame" }[stateOf(n)];
    S.pantry[n] = next; save(); renderPantry();
    const el = $(`[data-item="${CSS.escape(n)}"]`); if (el) el.focus({ preventScroll: true });
    return;
  }
  if (d.low !== undefined) {
    const low = Object.keys(S.pantry).filter(n => S.pantry[n] === "dochazi"), added = low.filter(n => addShop(n));
    save(); renderShop();
    return toast(added.length ? `Do nákupu přibylo: ${added.join(", ")}.` : "Všechno už v nákupu je.");
  }
  if (d.rSave !== undefined) {
    const names = $$("[data-r]:checked", body).map(i => RECEIPT[+i.dataset.r][1]);
    names.forEach(n => S.pantry[n] = "mame");
    const bought = $$("[data-r]", body).filter(i => i.checked || i.disabled).map(i => RECEIPT[+i.dataset.r][1]);
    S.shop.forEach(x => { if (bought.includes(x.name)) x.done = true; });
    save(); closeSheet(); renderPantry(); renderShop();
    return toast(`Spíž je doplněná (${names.length} ${plural(names.length, "položka", "položky", "položek")}).`);
  }
  if (d.styleSet) {
    if (d.styleSet === STYLE) return;
    STYLE = d.styleSet;
    document.documentElement.dataset.style = STYLE;
    try { localStorage.setItem("talirek-style-2", STYLE); } catch (e) {}
    syncStyleUI(); buildHero(); introDone = false; route();
    return;
  }
  if (t.id === "advise") return advise(true);
  if (t.id === "reroll") return advise(false);
  if (t.id === "receipt") return openReceipt();
  if (t.id === "scrim" || t.id === "sheet-close") return closeSheet();
  if (t.id === "clear-done") { S.shop = S.shop.filter(x => !x.done); save(); renderShop(); }
});

document.addEventListener("change", e => {
  const i = e.target.closest("[data-shop]");
  if (!i) return;
  const it = S.shop[+i.dataset.shop];
  it.done = i.checked;
  if (it.done && S.pantry[it.name]) { S.pantry[it.name] = "mame"; toast(`${cap(it.name)} je zpátky ve spíži.`); }
  save(); renderShop();
  const again = $(`[data-shop="${i.dataset.shop}"]`); if (again) again.focus({ preventScroll: true });
});

$("#shop-add").addEventListener("submit", e => {
  e.preventDefault();
  const inp = $("#shop-input"), v = inp.value.trim().toLowerCase();
  if (!v) return;
  if (!addShop(v)) toast(`${cap(v)} už v nákupu je.`);
  inp.value = ""; save(); renderShop(); inp.focus();
});

document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

(() => {
  const grab = $("#grab");
  let y0 = null, dy = 0, t0 = 0;
  grab.addEventListener("pointerdown", e => { y0 = e.clientY; t0 = performance.now(); dy = 0; sheet.style.transition = "none"; grab.setPointerCapture(e.pointerId); });
  grab.addEventListener("pointermove", e => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); sheet.style.transform = `translate(-50%,${dy}px)`; });
  const end = () => {
    if (y0 === null) return;
    const v = dy / Math.max(1, performance.now() - t0);
    y0 = null; sheet.style.transition = "";
    if (dy > 110 || v > .6) closeSheet(); else sheet.style.transform = "";
  };
  grab.addEventListener("pointerup", end);
  grab.addEventListener("pointercancel", end);
})();

buildDefs();
syncStyleUI();
renderShop();
addEventListener("hashchange", route);
route();
if (document.fonts && ST) document.fonts.ready.then(() => ST.refresh());
})();
</script>
</body>
</html>
